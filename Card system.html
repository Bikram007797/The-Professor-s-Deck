<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Professor's Deck – Card System</title>
<style>
:root{--red:#d3122a;--deep:#2a0509;--gold:#d9b25f;--ink:#0b0b0d}
*{box-sizing:border-box;margin:0}
body{background:#0b0b0d;color:#fff;font-family:Georgia,serif;padding:env(safe-area-inset-top) 12px 24px}
h1{text-align:center;color:var(--gold);letter-spacing:3px;font-size:1.1rem;padding:16px 0 4px}
p.t{text-align:center;color:#999;font-size:.75rem;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;justify-items:center}
/* flip */
.scene{width:250px;aspect-ratio:511/748;perspective:900px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.scene.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;overflow:hidden}
.back{transform:rotateY(180deg)}
/* silver outer frame */
.card{padding:7px;background:linear-gradient(135deg,#e8e8ec,#8d8d95 40%,#d9d9df 70%,#7a7a82);container-type:inline-size}
.frame{height:100%;border-radius:9px;border:2px solid var(--gold);display:flex;flex-direction:column;padding:3.5cqw;gap:2.5cqw;position:relative;
background:
radial-gradient(circle at 0 0,transparent 0 6cqw,rgba(255,255,255,.07) 6.5cqw 7cqw,transparent 7.5cqw) 0 0/14cqw 14cqw,
repeating-radial-gradient(circle at 50% 50%,#5a0a14 0 2px,#2a0509 2px 6px)}
/* chains */
.frame::before,.frame::after{content:"";position:absolute;top:14%;bottom:14%;width:5cqw;opacity:.55;
background:repeating-linear-gradient(180deg,#bbb 0 6px,transparent 6px 11px);border-radius:4px}
.frame::before{left:1.5cqw}.frame::after{right:1.5cqw}
.top{display:flex;align-items:center;gap:2.5cqw;z-index:1}
.name{flex:1;text-align:center;font:700 7.5cqw/1 Georgia,serif;letter-spacing:.12em;text-transform:uppercase;padding:2.5cqw 1cqw;border:2px solid var(--gold);border-radius:6px;
background:linear-gradient(#5a0a14,#2a0509);color:#f3d891;text-shadow:0 0 8px #d3122a;white-space:nowrap;overflow:hidden}
.medal{width:15cqw;height:15cqw;border-radius:50%;flex:none;display:grid;place-items:center;font:800 5cqw Georgia;color:#3a2600;
background:radial-gradient(#ffe8a0,#c9962f);border:2px solid #fff3c4;box-shadow:0 0 10px #d9b25f}
.medal.c{background:radial-gradient(#ddd,#888);color:#222}.medal.r{background:radial-gradient(#9fd0ff,#2d6fb5);color:#fff}.medal.e{background:radial-gradient(#e2a8ff,#7a2bb5);color:#fff}
.seal{width:15cqw;height:15cqw;border-radius:50%;flex:none;border:2px solid var(--gold);background:repeating-radial-gradient(#d3122a 0 2px,#2a0509 2px 5px)}
.art{flex:1;min-height:0;border:2px solid var(--gold);border-radius:3px;overflow:hidden;position:relative;z-index:1;background:#150003}
.art img,.art svg{width:100%;height:100%;object-fit:cover;display:block}
.shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-120%);animation:sh 4s infinite}
@keyframes sh{60%,100%{transform:translateX(120%)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1.8cqw;z-index:1}
.pill{display:flex;align-items:center;gap:1.5cqw;border:1.5px solid var(--gold);border-radius:99px;background:#1a0205;padding:1.2cqw 2.4cqw;font:700 3.5cqw Georgia;letter-spacing:.04em;color:#f3d891;position:relative;overflow:hidden}
.pill i{font-style:normal;width:5.5cqw;height:5.5cqw;border-radius:50%;display:grid;place-items:center;background:#d3122a;font-size:3cqw;flex:none}
.pill b{margin-left:auto;color:#fff}
.pill s{position:absolute;left:0;bottom:0;height:2px;background:var(--red);box-shadow:0 0 6px var(--red)}
.pill.hi{outline:2px solid #fff}
.scroll{z-index:1;background:linear-gradient(#f2dfb0,#d9bd80);color:#3a2a10;border-radius:4px;padding:2cqw 4cqw;font:italic 3.3cqw/1.3 Georgia;text-align:center;border-left:3cqw solid #8a5a1a;border-right:3cqw solid #8a5a1a}
.id{font:600 2.6cqw monospace;color:#caa;text-align:center;z-index:1}
.back .frame{align-items:center;justify-content:center;background:radial-gradient(#5a0a14,#0b0003)}
.back .mask{width:48%;opacity:.9;filter:drop-shadow(0 0 12px #d3122a)}
.back h2{font:700 6cqw Georgia;letter-spacing:.2em;color:var(--gold);margin-top:5cqw;text-align:center}
</style></head><body>
<h1>THE PROFESSOR'S DECK</h1>
<p class="t">Tap a card to flip · tap an attribute to highlight it</p>
<div class="grid" id="g"></div>
<script>
/* ===== CARD DATA (would live in js/cards.js) =====
   a = [intelligence, strategy, speed, stealth, negotiation, execution]
   Image: assets/cards/<id>.webp — falls back to generated original art. */
const CARDS=[
["Professor","L",[99,99,55,90,88,60],"The mastermind who planned every move."],
["Tokyo","L",[70,72,90,66,60,96],"Reckless heart and narrator of the heist."],
["Berlin","L",[88,92,60,55,84,90],"Ruthless, elegant second-in-command."],
["Nairobi","E",[80,78,70,60,86,88],"Forger and leader of the mint's workshop."],
["Rio","C",[84,60,76,80,50,66],"The young hacker who breaks the firewall."],
["Denver","C",[48,52,70,40,72,84],"Loyal muscle with an unmistakable laugh."],
["Moscow","R",[62,70,52,45,66,90],"Veteran miner who digs the way out."],
["Helsinki","C",[56,58,50,55,45,92],"Quiet strongman with a soldier's discipline."],
["Oslo","C",[44,50,48,60,40,88],"Silent enforcer, loyal to Helsinki."],
["Bogotá","R",[74,66,58,62,70,82],"Tunnel expert with steady nerves."],
["Palermo","L",[95,94,64,70,90,78],"Brilliant strategist with a dangerous ego."],
["Stockholm","R",[72,58,66,56,86,68],"Hostage turned rebel inside the mint."],
["Manila","C",[54,50,74,70,58,64],"Young thief with sharp instincts."],
["Marseille","R",[78,74,62,68,60,80],"Cold, precise operative of the new crew."],
["Lisbon","E",[86,84,78,72,92,85],"Inspector who joined the other side."],
["Alicia Sierra","E",[94,90,68,50,82,76],"Relentless, pregnant, brilliant investigator."],
["Prieto","R",[66,70,60,50,58,78],"Hard-line colonel of the security forces."],
["Gandía","R",[52,58,56,64,38,88],"Loyal head of mint security."],
["Tamayo","E",[70,76,54,48,56,86],"Ruthless colonel with a short fuse."],
["Ángel Rubio","C",[60,52,50,70,56,48],"Dogged inspector with a hidden agenda."],
["Arturo","C",[50,46,48,34,76,30],"Self-serving director of the mint."],
["Mónica","C",[58,48,54,52,70,42],"Hostage who finds her own path."],
["Suárez","C",[46,56,58,54,44,66],"Special-forces commander on the outside."],
["Sagasta","R",[82,84,46,62,90,70],"Cunning minister with deep influence."],
["Cincinnati","C",[56,46,62,58,60,52],"Pilot and Gandía's quiet ally."],
["Mercedes","C",[64,60,60,66,78,56],"Calm negotiator with sharp composure."],
["Pamplona","R",[62,64,70,60,66,74],"Reliable fighter with a sharp mind."],
["Matías","C",[68,60,52,48,56,58],"Technician who sees what others miss."],
["Zulema","E",[78,80,72,82,70,84],"Prisoner turned hunter with no mercy."],
["Paula","C",[50,54,76,72,52,60],"Young survivor with big courage."]
].map((c,i)=>({id:"MH-"+String(i+1).padStart(3,"0"),name:c[0],rarity:{C:"Common",R:"Rare",E:"Epic",L:"Legendary"}[c[1]],r:c[1],
 bio:c[3],attributes:{intelligence:c[2][0],strategy:c[2][1],speed:c[2][2],stealth:c[2][3],negotiation:c[2][4],execution:c[2][5]},image:`assets/cards/MH-${String(i+1).padStart(3,"0")}.webp`}));
const ICON={intelligence:"◆",strategy:"♜",speed:"➤",stealth:"◐",negotiation:"✦",execution:"✖"};
const MED={C:"C",R:"R",E:"E",L:"LGD"};

/* original placeholder art: red jumpsuit + white mask silhouette, unique per card */
function art(c,n){
 const h=(n*47)%360,x=(n*13)%30-15;
 return `<svg viewBox="0 0 200 260" preserveAspectRatio="xMidYMid slice"><defs>
 <radialGradient id="b${n}" cx="50%" cy="40%"><stop offset="0" stop-color="hsl(${350+h%20},80%,45%)"/><stop offset="1" stop-color="#150003"/></radialGradient></defs>
 <rect width="200" height="260" fill="url(#b${n})"/>
 <g fill="none" stroke="rgba(255,255,255,.12)" stroke-width="3">${[30,60,90,120].map(r=>`<circle cx="${100+x}" cy="110" r="${r}"/>`).join("")}</g>
 <path d="M${40+x} 260 Q${50+x} 170 100 165 Q${150-x} 170 ${160+x} 260Z" fill="#c4101f"/>
 <path d="M${100+x/2} 165 v95" stroke="#6b0710" stroke-width="3"/>
 <ellipse cx="${100+x/2}" cy="105" rx="30" ry="40" fill="#f2efe6"/>
 <path d="M${82+x/2} 92 q8 -6 14 0 M${106+x/2} 92 q8 -6 14 0" stroke="#111" stroke-width="3" fill="none"/>
 <path d="M${88+x/2} 128 q12 8 24 0" stroke="#111" stroke-width="3" fill="none"/>
 <path d="M${96+x/2} 100 q4 10 8 0" stroke="#111" stroke-width="2" fill="none"/>
 <path d="M${70+x/2} 70 q30 -34 60 0" fill="#1b1b1f"/></svg>`;
}
function cardHTML(c,n){
 const pills=Object.entries(c.attributes).map(([k,v])=>`<div class="pill" data-k="${k}"><i>${ICON[k]}</i>${k.slice(0,3).toUpperCase()}<b>${v}</b><s style="width:${v}%"></s></div>`).join("");
 return `<div class="scene"><div class="inner">
 <div class="face card"><div class="frame">
  <div class="top"><div class="seal"></div><div class="name">${c.name}</div><div class="medal ${c.r.toLowerCase()}">${MED[c.r]}</div></div>
  <div class="art"><img loading="lazy" alt="${c.name}" src="${c.image}" onerror="this.outerHTML=window.__art(${n})"><div class="shine"></div></div>
  <div class="stats">${pills}</div>
  <div class="scroll">${c.bio}</div><div class="id">${c.id} · ${c.rarity.toUpperCase()}</div>
 </div></div>
 <div class="face card back"><div class="frame">
  <svg class="mask" viewBox="0 0 100 130"><ellipse cx="50" cy="60" rx="36" ry="50" fill="#f2efe6"/><path d="M30 45q8-7 16 0M54 45q8-7 16 0M38 82q12 10 24 0" stroke="#111" stroke-width="4" fill="none"/></svg>
  <h2>THE PROFESSOR'S DECK</h2></div></div>
 </div></div>`;
}
window.__art=n=>art(CARDS[n],n);
const g=document.getElementById("g");
g.innerHTML=CARDS.map(cardHTML).join("");
g.addEventListener("click",e=>{
 const p=e.target.closest(".pill"),s=e.target.closest(".scene");
 if(p){const on=p.classList.contains("hi");s.querySelectorAll(".pill").forEach(x=>x.classList.remove("hi"));if(!on)p.classList.add("hi");return}
 s.classList.toggle("flip");
});
if(matchMedia("(prefers-reduced-motion:reduce)").matches)document.querySelectorAll(".shine").forEach(x=>x.remove());
</script></body></html>
